name: Markdown

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  lint:
    name: Lint Markdown
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        # actions/checkout@v5.1.0
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Run Markdown lint
        # DavidAnson/markdownlint-cli2-action@v18.0.0
        uses: DavidAnson/markdownlint-cli2-action@eb5ca3ab411449c66620fe7f1b3c9e10547144b0
        with:
          # Exclusions live in `.markdownlint-cli2.jsonc` (`ignores`), the
          # single list every markdown entry point inherits.
          globs: |
            **/*.md
