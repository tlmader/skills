name: Sync Work plugin

# Cursor marketplaces list only plugins stored in this repository, so
# plugins/work is a copy of patinaproject/skills' Work plugin. This refreshes
# the copy daily. When it changed, the run reuses one open tracking issue and
# opens or updates one pull request. If Actions cannot create pull requests,
# it records the required setting on that issue and exits successfully:
# Settings > Actions > General > Workflow permissions >
# Allow GitHub Actions to create and approve pull requests.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: sync-work
  cancel-in-progress: false

jobs:
  sync:
    name: Sync Work plugin
    runs-on: ubuntu-latest
    env:
      BRANCH: sync-work
      GH_TOKEN: ${{ github.token }}
    steps:
      # actions/checkout@v5.1.0
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Copy the upstream plugin
        id: copy
        run: |
          sha="$(bash scripts/sync-work-plugin.sh)"
          echo "sha=${sha:0:7}" >> "$GITHUB_OUTPUT"
          if [ -z "$(git status --porcelain -- plugins/work)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update the sync pull request
        if: steps.copy.outputs.changed == 'true'
        env:
          SHA: ${{ steps.copy.outputs.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: bash scripts/open-work-sync-pr.sh
